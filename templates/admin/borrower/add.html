{% extends "layouts/base.html" %}

{% block contents %}
    <div class="content-wrapper">
        <!-- Page Header -->
        <div class="page-header">
            <h3 class="page-title">
              <span class="page-title-icon bg-gradient-primary text-white mr-2">
                <i class="mdi mdi-account-plus"></i>
              </span> Add New Borrower
            </h3>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('admin.borrower') }}">Borrowers</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Add</li>
                </ol>
            </nav>
        </div>

        <!-- Alert area -->
        <div id="alert-container" class="alert alert-danger d-none" role="alert"></div>

        <!-- Form Card -->
        <div class="row">
            <div class="col-md-8 grid-margin stretch-card mx-auto">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Borrower Profile & Login Account</h4>
                        <p class="card-description"> Create a customer profile which automatically spawns their user
                            portal credentials. </p>

                        <form class="forms-sample" id="addCustomerForm">
                            <h5 class="text-primary mb-3 mt-4"><i class="mdi mdi-account-card-details mr-2"></i>Personal
                                Profile</h5>

                            <div class="form-group row">
                                <label for="name" class="col-sm-3 col-form-label font-weight-bold">Full Name</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="national_id" class="col-sm-3 col-form-label font-weight-bold">National ID /
                                    Passport</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="national_id"
                                           placeholder="e.g. NID-883712" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="phone" class="col-sm-3 col-form-label font-weight-bold">Phone Number</label>
                                <div class="col-sm-9">
                                    <input type="tel" class="form-control" id="phone" placeholder="e.g. +1 555-0100"
                                           required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="email" class="col-sm-3 col-form-label font-weight-bold">Email
                                    Address</label>
                                <div class="col-sm-9">
                                    <input type="email" class="form-control" id="email"
                                           placeholder="john.doe@example.com" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="address" class="col-sm-3 col-form-label font-weight-bold">Home
                                    Address</label>
                                <div class="col-sm-9">
                                    <textarea class="form-control" id="address" rows="3"
                                              placeholder="Street Address, City, State, ZIP" required></textarea>
                                </div>
                            </div>

                            <hr class="my-4">
                            <h5 class="text-success mb-3"><i class="mdi mdi-key-variant mr-2"></i>Portal Login
                                Credentials</h5>

                            <div class="form-group row">
                                <label for="username" class="col-sm-3 col-form-label font-weight-bold">Login
                                    Username</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="username"
                                           placeholder="Choose a username" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="password" class="col-sm-3 col-form-label font-weight-bold">Login
                                    Password</label>
                                <div class="col-sm-9">
                                    <input type="password" class="form-control" id="password"
                                           placeholder="Choose a password" required>
                                </div>
                            </div>

                            <div class="form-group row mt-4">
                                <div class="col-sm-9 offset-sm-3">
                                    <button type="submit" class="btn btn-gradient-primary mr-2">Create Account</button>
                                    <a href="{{ url_for('admin.borrower') }}" class="btn btn-light">Cancel</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <!-- content-wrapper ends -->
    <footer class="footer" id="footer"></footer>
{% endblock %}
