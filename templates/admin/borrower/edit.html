{% extends "layouts/base.html" %}

{% block contents %}
    <div class="content-wrapper">
        <!-- Page Header -->
        <div class="page-header">
            <h3 class="page-title">
              <span class="page-title-icon bg-gradient-primary text-white mr-2">
                <i class="mdi mdi-lead-pencil"></i>
              </span> Edit Borrower Profile
            </h3>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('admin.borrower') }}">Borrowers</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Edit</li>
                </ol>
            </nav>
        </div>

        <!-- Alert area -->
        <div id="alert-container" class="alert alert-danger d-none" role="alert"></div>

        <!-- Form Card -->
        <div class="row">
            <div class="col-md-8 grid-margin stretch-card mx-auto">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title" id="form-title">Edit Borrower Details</h4>
                        <p class="card-description"> Update borrower profile information and account credentials. </p>

                        <form class="forms-sample" id="editCustomerForm">
                            <h5 class="text-primary mb-3 mt-4"><i class="mdi mdi-account-card-details mr-2"></i>Personal
                                Profile</h5>

                            <div class="form-group row">
                                <label for="name" class="col-sm-3 col-form-label font-weight-bold">Full Name</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="national_id" class="col-sm-3 col-form-label font-weight-bold">National ID /
                                    Passport</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="national_id" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="phone" class="col-sm-3 col-form-label font-weight-bold">Phone Number</label>
                                <div class="col-sm-9">
                                    <input type="tel" class="form-control" id="phone" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="email" class="col-sm-3 col-form-label font-weight-bold">Email
                                    Address</label>
                                <div class="col-sm-9">
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="address" class="col-sm-3 col-form-label font-weight-bold">Home
                                    Address</label>
                                <div class="col-sm-9">
                                    <textarea class="form-control" id="address" rows="3" required></textarea>
                                </div>
                            </div>

                            <hr class="my-4">
                            <h5 class="text-success mb-3"><i class="mdi mdi-key-variant mr-2"></i>Portal Login
                                Credentials</h5>

                            <div class="form-group row">
                                <label for="username" class="col-sm-3 col-form-label font-weight-bold">Login
                                    Username</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control text-muted" id="username" readonly>
                                    <small class="text-muted">Username cannot be changed.</small>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label for="password" class="col-sm-3 col-form-label font-weight-bold">New
                                    Password</label>
                                <div class="col-sm-9">
                                    <input type="password" class="form-control" id="password"
                                           placeholder="Leave blank to keep current password">
                                </div>
                            </div>

                            <div class="form-group row mt-4">
                                <div class="col-sm-9 offset-sm-3">
                                    <button type="submit" class="btn btn-gradient-primary mr-2">Update Account</button>
                                    <a href="{{ url_for('admin.borrower') }}" class="btn btn-light">Cancel</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <!-- content-wrapper ends -->
    <footer class="footer" id="footer"></footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (document.getElementById('name')) document.getElementById('name').value = "Touch Sovannita";
            if (document.getElementById('national_id')) document.getElementById('national_id').value = "NID-99201";
            if (document.getElementById('phone')) document.getElementById('phone').value = "0973003645";
            if (document.getElementById('email')) document.getElementById('email').value = "visazin128@gmail.com";
            if (document.getElementById('address')) document.getElementById('address').value = "Phnom Penh, Cambodia";
            if (document.getElementById('username')) document.getElementById('username').value = "sovannita";

            document.getElementById('editCustomerForm')?.addEventListener('submit', function(e) {
                e.preventDefault();
                Swal.fire({
                    title: 'Updated!',
                    text: 'Borrower profile updated successfully.',
                    icon: 'success'
                }).then(() => {
                    window.location.href = "{{ url_for('admin.borrower') }}";
                });
            });
        });
    </script>
{% endblock %}
