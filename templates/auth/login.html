<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/login.css') }}"/>
    {% include "partials/style-shop.html" %}
</head>
<body>
<div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
            <div class="row flex-grow">
                <div class="col-lg-4 mx-auto">
                    <div class="auth-form-light text-left p-5">
                        <div class="brand-logo mb-4">
                            <h2 class="text-primary font-weight-bold d-flex align-items-center">
                                <i class="mdi mdi-bank mr-2" style="font-size: 2.2rem;"></i>
                                LMS
                            </h2>
                        </div>
                        <h4>Welcome to Loan Management</h4>
                        <h6 class="font-weight-light">Sign in to access your portal.</h6>

                        <div id="alert-box" class="alert alert-danger d-none mt-3" role="alert"></div>

                        <form class="pt-3" method="POST" action="{{ url_for('root') }}">
                            <div class="form-group">
                                <label for="username">Username</label>
                                <input type="text" class="form-control form-control-lg" id="username" name="username"
                                       placeholder="Username" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" class="form-control form-control-lg" id="password" name="password"
                                       placeholder="Password" required>
                            </div>
                            <div class="mt-4">
                                <button type="submit"
                                        class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn">
                                    SIGN IN
                                </button>
                            </div>

                            {% if error %}
                                <p style="color: red;">{{ error }}</p>
                            {% endif %}
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
