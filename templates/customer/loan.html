{% extends "layouts/base.html" %}

{% block contents %}
	<div class="content-wrapper">
          <!-- Page Header -->
          <div class="page-header flex-wrap">
            <h3 class="page-title">
              <span class="page-title-icon bg-gradient-success text-white mr-2">
                <i class="mdi mdi-cash-multiple"></i>
              </span> My Loans
            </h3>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="customer_dashboard.html">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Loans</li>
              </ol>
            </nav>
          </div>

          <!-- Alert area -->
          <div id="alert-container" class="alert alert-danger d-none" role="alert"></div>

          <!-- Filter Card -->
          <div class="row mb-4">
            <div class="col-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Filter My Loans</h4>
                  <div class="form-group row mb-0">
                    <div class="col-md-4">
                      <select class="form-control" id="cust-filter-status" onchange="applyFilter()">
                        <option value="All">All Loans</option>
                        <option value="Pending">Pending</option>
                        <option value="Active">Active</option>
                        <option value="Closed">Closed</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Loans Table Card -->
          <div class="row">
            <div class="col-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Agreement Portfolios</h4>
                  <div class="table-responsive">
                    <table class="table table-hover">
                      <thead>
                        <tr>
                          <th> Loan ID </th>
                          <th> Principal Amount </th>
                          <th> Interest Rate </th>
                          <th> Duration </th>
                          <th> Total Repayable </th>
                          <th> Total Paid </th>
                          <th> Status </th>
                          <th> Start Date </th>
                          <th> Action </th>
                        </tr>
                      </thead>
                      <tbody id="cust-loans-table-body">
                        <!-- Dynamically filled -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
        <!-- content-wrapper ends -->
        <footer class="footer" id="footer"></footer>
{% endblock %}
