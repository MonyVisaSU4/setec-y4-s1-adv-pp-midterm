{% extends "layouts/base.html" %}

{% block contents %}
	<div class="content-wrapper">
          <!-- Page Header -->
          <div class="page-header flex-wrap">
            <h3 class="page-title">
              <span class="page-title-icon bg-gradient-success text-white mr-2">
                <i class="mdi mdi-cash-multiple"></i>
              </span> My Loans
            </h3>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('customer.dashboard') }}">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Loans</li>
              </ol>
            </nav>
          </div>

          <!-- Alert area -->
          <div id="alert-container" class="alert alert-danger d-none" role="alert"></div>

          <!-- Filter Card -->
          <div class="row mb-4">
            <div class="col-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Filter My Loans</h4>
                  <div class="form-group row mb-0">
                    <div class="col-md-4">
                      <select class="form-control" id="cust-filter-status" onchange="applyFilter()">
                        <option value="All">All Loans</option>
                        <option value="Pending">Pending</option>
                        <option value="Active">Active</option>
                        <option value="Closed">Closed</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Loans Table Card -->
          <div class="row">
            <div class="col-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Agreement Portfolios</h4>
                  <div class="table-responsive">
                    <table class="table table-hover">
                      <thead>
                        <tr>
                          <th> Loan ID </th>
                          <th> Principal Amount </th>
                          <th> Interest Rate </th>
                          <th> Duration </th>
                          <th> Total Repayable </th>
                          <th> Total Paid </th>
                          <th> Status </th>
                          <th> Start Date </th>
                          <th> Action </th>
                        </tr>
                      </thead>
                      <tbody id="cust-loans-table-body">
                        <!-- Dynamically filled -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
        <!-- content-wrapper ends -->
        <footer class="footer" id="footer"></footer>

    <script>
        const myLoans = [
            { id: 'LOAN_884', principal: 12000.00, rate: 5, duration: 12, total: 12600.00, paid: 6000.00, status: 'Active', start: '2026-04-09' },
            { id: 'LOAN_882', principal: 5000.00, rate: 8, duration: 6, total: 5200.00, paid: 5200.00, status: 'Closed', start: '2026-01-10' }
        ];

        function applyFilter() {
            const filter = document.getElementById('cust-filter-status').value;
            const tbody = document.getElementById('cust-loans-table-body');
            const filtered = myLoans.filter(l => filter === 'All' || l.status.toLowerCase() === filter.toLowerCase());

            if (filtered.length > 0) {
                tbody.innerHTML = filtered.map(l => `
                    <tr>
                        <td><code>${l.id}</code></td>
                        <td class="font-weight-bold">$${l.principal.toFixed(2)}</td>
                        <td>${l.rate}%</td>
                        <td>${l.duration} mo</td>
                        <td class="font-weight-bold text-dark">$${l.total.toFixed(2)}</td>
                        <td class="text-success font-weight-bold">$${l.paid.toFixed(2)}</td>
                        <td><span class="badge badge-${l.status === 'Active' ? 'success' : l.status === 'Pending' ? 'warning' : 'secondary'}">${l.status}</span></td>
                        <td>${l.start}</td>
                        <td>
                            <a href="{{ url_for('customer.schedule') }}" class="btn btn-sm btn-gradient-info">
                                <i class="mdi mdi-eye mr-1"></i>View Schedule
                            </a>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">No loans match the filter.</td></tr>`;
            }
        }

        document.addEventListener("DOMContentLoaded", applyFilter);
    </script>
{% endblock %}
